name: Validate Site and Deploy

on:
  workflow_dispatch:
    inputs:
      rerender:
        description: 'Force re-render executable posts'
        type: boolean
        default: false
  schedule:
    # Weekly deployment - Sunday 19:00 UTC (GitHub Actions cron is always UTC).
    # Note: UTC does not observe daylight saving, so this lands at 20:00 UK time
    # during BST and 19:00 during GMT.
    - cron: '0 19 * * 0'
  push:
    branches:
      - main
      - feature/*
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  render_site:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Quarto (latest stable release)
      uses: quarto-dev/quarto-actions/setup@v2
      with:
        version: release
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Jupyter
      run: pip install jupyter
    - name: Verify Install
      run: |
        quarto --version
        quarto check
    - name: Setup post venvs and re-render
      if: inputs.rerender == true
      run: |
        for req_file in $(find site/tips site/Tutorials -name requirements.txt); do
          post_dir=$(dirname "$req_file")
          python3 -m venv "$post_dir/.venv"
          source "$post_dir/.venv/bin/activate"
          pip install --upgrade pip
          pip install -r "$req_file"
          for qmd_file in "$post_dir"/*.qmd; do
            quarto render "$qmd_file"
          done
          deactivate
        done
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        DATABRICKS_CLUSTER_ID: ${{ secrets.DATABRICKS_CLUSTER_ID }}
    - name: render site
      run: quarto render site/
    - name: Output folder directories
      run: ls
    - name: Upload _site directory for deploy job
      uses: actions/upload-artifact@v4
      with:
          name: site_deployment
          path: site/_site
  deploy_to_azure_static_webapp:
    needs: render_site
    # github.ref (unlike github.event.ref) is populated for every event type, so
    # scheduled and manually dispatched runs on main deploy as well as pushes.
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Deploy to Azure App Service
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site_deployment
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_FLOWER_08F5FF603 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          output_location: "public" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
