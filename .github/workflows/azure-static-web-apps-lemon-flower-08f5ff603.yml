name: Validate Site and Deploy

on:
  workflow_dispatch:
    inputs:
      rerender:
        description: 'Force re-render executable posts'
        type: boolean
        default: false
  schedule:
    # Weekly deployment - Sunday 19:00 UTC (GitHub Actions cron is always UTC).
    # Note: UTC does not observe daylight saving, so this lands at 20:00 UK time
    # during BST and 19:00 during GMT.
    - cron: '0 19 * * 0'
  push:
    branches:
      - main
      - feature/*
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  render_site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@v4
    - name: Setup Quarto (latest stable release)
      uses: quarto-dev/quarto-actions/setup@v2
      with:
        version: release
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Jupyter
      run: pip install jupyter
    - name: Verify Install
      run: |
        quarto --version
        quarto check
    - name: Setup post venvs and re-render
      if: inputs.rerender == true
      run: |
        for req_file in $(find site/tips site/Tutorials -name requirements.txt); do
          post_dir=$(dirname "$req_file")
          python3 -m venv "$post_dir/.venv"
          source "$post_dir/.venv/bin/activate"
          pip install --upgrade pip
          pip install -r "$req_file"
          for qmd_file in "$post_dir"/*.qmd; do
            quarto render "$qmd_file"
          done
          deactivate
        done
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        DATABRICKS_CLUSTER_ID: ${{ secrets.DATABRICKS_CLUSTER_ID }}
    - name: render site
      id: render
      # Keep the log so the steps below can turn Quarto's diagnostics into
      # tickets. A failed render must still reach those steps, so the job is
      # failed explicitly at the end rather than here.
      continue-on-error: true
      run: |
        set -o pipefail
        quarto render site/ 2>&1 | tee render.log
    - name: Collect render diagnostics
      run: |
        python3 scripts/parse_render_log.py render.log \
          ${{ steps.render.outcome == 'failure' && '--render-failed' || '' }} \
          > render-findings.json
        cat render-findings.json
    - name: Ensure render issue labels exist
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh label create render-issue --force --color B60205 \
          --description 'Raised automatically from a site render'
        gh label create render-error --force --color D93F0B \
          --description 'Render diagnostic: error'
        gh label create render-warning --force --color FBCA04 \
          --description 'Render diagnostic: warning'
        gh label create automated --force --color C5DEF5 \
          --description 'Opened by automation'
    - name: Raise issues for render diagnostics
      # Only the default branch files real tickets; every other ref reports
      # what it would have filed, so branches cannot spam the tracker.
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 scripts/report_render_issues.py render-findings.json \
          ${{ github.ref == 'refs/heads/main' && '' || '--dry-run' }}
    - name: Output folder directories
      run: ls
    - name: Upload _site directory for deploy job
      if: steps.render.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
          name: site_deployment
          path: site/_site
    - name: Fail the job if the render failed
      if: steps.render.outcome == 'failure'
      run: |
        echo "::error::quarto render failed - see the issues raised above"
        exit 1
  deploy_to_azure_static_webapp:
    needs: render_site
    # github.ref (unlike github.event.ref) is populated for every event type, so
    # scheduled and manually dispatched runs on main deploy as well as pushes.
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Deploy to Azure App Service
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site_deployment
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_FLOWER_08F5FF603 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          output_location: "public" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
